name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            image: mirror.gcr.io/library/php:8.3-cli-bookworm@sha256:107f022053b2222ffd64f957c2a3b4c724c506301c84638e537f9027ed6468f5
          - php: "8.4"
            image: mirror.gcr.io/library/php:8.4-cli-bookworm@sha256:8f0c382c6483a202baaad042c9ad51064f050de1093e5e8db990d055dd18534f
          - php: "8.5"
            image: mirror.gcr.io/library/php:8.5-cli-bookworm@sha256:08ff080781ceb69e81f886513b89daa830aee389abef4bdebc174737b9c0ba81
    env:
      PHP_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Composer and npm download caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: dependencies-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock', 'e2e/package-lock.json') }}
          restore-keys: |
            dependencies-${{ runner.os }}-php-${{ matrix.php }}-
            dependencies-${{ runner.os }}-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and cache PHP images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/php/Dockerfile
          build-args: PHP_IMAGE=${{ matrix.image }}
          tags: |
            directoryindex-qa:local
            directoryindex-web:local
          load: true
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
      - name: Install locked dependencies
        run: make dependencies
      - name: Lint and run PHPUnit
        run: make lint test
      - name: Test the standalone bundle in minimal PHP
        run: make smoke
      - name: Run Playwright against PHP ${{ matrix.php }}
        run: make e2e
      - name: Run Playwright against Apache
        if: matrix.php == '8.3'
        run: make e2e-apache
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-php-${{ matrix.php }}
          path: e2e/playwright-report
          if-no-files-found: ignore

  quality:
    name: Complete quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PHP_IMAGE: mirror.gcr.io/library/php:8.3-cli-bookworm@sha256:107f022053b2222ffd64f957c2a3b4c724c506301c84638e537f9027ed6468f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Composer download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and cache the PHP quality image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .docker/php/Dockerfile
          build-args: PHP_IMAGE=${{ env.PHP_IMAGE }}
          tags: directoryindex-qa:local
          load: true
          cache-from: type=gha,scope=php-8.3
          cache-to: type=gha,mode=max,scope=php-8.3-quality
      - name: Install locked PHP dependencies
        run: make php-install
      - name: Run static, structural coverage, security, and mutation gates
        run: make infra qa mutation
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: build/coverage/html
          if-no-files-found: ignore
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-reports
          path: build/infection*.log
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
